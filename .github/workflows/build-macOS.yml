name: Build macOS App Shell

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Swift Code
        run: |
          mkdir -p build_output
          
          # Build x86_64 slice (macOS 10.15+)
          swiftc -parse-as-library -target x86_64-apple-macosx10.15 -O \
            $(find TeachingProtect -name "*.swift") \
            -o SlideLock_x86_64 || echo "x86_64 build failed"
            
          # Build arm64 slice (macOS 11.0+)
          swiftc -parse-as-library -target arm64-apple-macosx11.0 -O \
            $(find TeachingProtect -name "*.swift") \
            -o SlideLock_arm64 || echo "arm64 build failed"
            
          # Combine into Universal Binary if both exist, otherwise use one
          if [ -f SlideLock_x86_64 ] && [ -f SlideLock_arm64 ]; then
            lipo -create -output build_output/SlideLock SlideLock_x86_64 SlideLock_arm64
          elif [ -f SlideLock_x86_64 ]; then
            mv SlideLock_x86_64 build_output/SlideLock
          elif [ -f SlideLock_arm64 ]; then
            mv SlideLock_arm64 build_output/SlideLock
          else
            echo "Both builds failed!"
            exit 1
          fi

      - name: Package App Shell
        run: |
          # Use SlideLock.app.old4 which is tracked in Git
          cp -R SlideLock.app.old4 build_output/SlideLock.app
          
          # Patch Info.plist to 10.15.7
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 10.15.7" build_output/SlideLock.app/Contents/Info.plist
          
          # Replace the binary
          cp build_output/SlideLock build_output/SlideLock.app/Contents/MacOS/SlideLock
          chmod +x build_output/SlideLock.app/Contents/MacOS/SlideLock
          
          # Zip it up
          cd build_output
          zip -r SlideLock-App-Shell-MacOS.zip SlideLock.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlideLock-App-Shell-MacOS
          path: build_output/SlideLock-App-Shell-MacOS.zip
